services:
  api:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - taxidverify-data:/app/data
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  taxidverify-data:
